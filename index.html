<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Villa Review Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #f7f3ee;
    --sand-dark: #ede7dc;
    --tan: #c9b99a;
    --tan-dark: #a8956e;
    --bark: #5a4a36;
    --bark-light: #7a6448;
    --ink: #2c2418;
    --ink-soft: #6b5940;
    --white: #ffffff;
    --green-bg: #eaf4ec;
    --green-txt: #2d6e35;
    --red-bg: #fdecea;
    --red-txt: #b83030;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(90,74,54,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--sand);
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    background: var(--bark);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--sand);
    letter-spacing: 0.01em;
  }

  header span {
    font-size: 13px;
    color: var(--tan);
  }

  .toolbar {
    padding: 20px 32px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: var(--radius);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.18s, transform 0.1s;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary { background: var(--bark); color: var(--sand); }
  .btn-primary:hover { background: var(--bark-light); }

  .btn-ghost {
    background: transparent;
    color: var(--bark);
    border: 1.5px solid var(--tan);
  }
  .btn-ghost:hover { background: var(--sand-dark); }

  .filter-group { display: flex; gap: 6px; margin-left: auto; }

  .filter-btn {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--tan);
    background: transparent;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    color: var(--bark);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--bark);
    color: var(--sand);
    border-color: var(--bark);
  }

  .stats-bar {
    padding: 14px 32px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat { font-size: 13px; color: var(--ink-soft); }
  .stat strong { font-weight: 500; color: var(--ink); margin-right: 4px; }

  .table-wrapper {
    margin: 0 32px 40px;
    background: var(--white);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--sand-dark);
  }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }

  thead tr { background: var(--ink); color: var(--sand); }

  thead th {
    padding: 13px 16px;
    font-size: 12px;
    font-weight: 500;
    text-align: left;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  thead th:nth-child(1) { width: 160px; }
  thead th:nth-child(2) { width: auto; }
  thead th:nth-child(3) { width: 90px; text-align: center; }
  thead th:nth-child(4) { width: 200px; }
  thead th:nth-child(5) { width: 140px; }
  thead th:nth-child(6) { width: 70px; text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--sand-dark);
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #faf8f5; }
  tbody tr.row-used { background: #f2faf3; }
  tbody tr.row-used:hover { background: #e8f5ea; }

  td { padding: 12px 16px; font-size: 14px; vertical-align: top; }

  .villa-name { font-weight: 500; color: var(--ink); line-height: 1.4; }
  .review-cell { position: relative; }

  .review-text {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .review-text.collapsed {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .expand-btn {
    background: none;
    border: none;
    color: var(--tan-dark);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 0;
    font-family: 'DM Sans', sans-serif;
    text-decoration: underline;
    margin-top: 4px;
    display: block;
  }

  .check-cell { text-align: center; }

  .custom-checkbox {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--tan);
    background: var(--white);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .custom-checkbox.checked { background: var(--green-txt); border-color: var(--green-txt); }
  .custom-checkbox svg { display: none; }
  .custom-checkbox.checked svg { display: block; }

  .notes-input {
    width: 100%;
    border: 1px solid var(--sand-dark);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    background: var(--sand);
    color: var(--ink);
    resize: vertical;
    min-height: 38px;
    transition: border-color 0.15s;
  }
  .notes-input:focus { outline: none; border-color: var(--tan-dark); background: var(--white); }

  .date-input {
    width: 100%;
    border: 1px solid var(--sand-dark);
    border-radius: 7px;
    padding: 6px 9px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    background: var(--sand);
    color: var(--ink);
    transition: border-color 0.15s;
  }
  .date-input:focus { outline: none; border-color: var(--tan-dark); background: var(--white); }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--tan);
    padding: 4px;
    border-radius: 5px;
    transition: color 0.15s, background 0.15s;
    display: block;
    margin: 0 auto;
  }
  .del-btn:hover { color: var(--red-txt); background: var(--red-bg); }

  .empty-state { text-align: center; padding: 56px 20px; color: var(--ink-soft); }
  .empty-state p { font-size: 15px; margin-top: 8px; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(44,36,24,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 16px;
    padding: 28px 32px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 8px 40px rgba(44,36,24,0.22);
  }

  .modal h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 22px;
  }

  .form-field { margin-bottom: 18px; }

  .form-field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  .form-input {
    width: 100%;
    border: 1.5px solid var(--sand-dark);
    border-radius: 9px;
    padding: 10px 13px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    background: var(--sand);
    color: var(--ink);
    transition: border-color 0.15s;
  }
  .form-input:focus { outline: none; border-color: var(--bark); background: var(--white); }

  textarea.form-input { resize: vertical; min-height: 140px; line-height: 1.6; }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  .badge-used {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    background: var(--green-bg);
    color: var(--green-txt);
    margin-left: 6px;
  }

  @media (max-width: 700px) {
    header, .toolbar, .stats-bar { padding-left: 16px; padding-right: 16px; }
    .table-wrapper { margin: 0 16px 32px; }
    thead th:nth-child(4), td:nth-child(4) { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Villa Review Manager</h1>
  <span id="save-status"></span>
</header>

<div class="toolbar">
  <button class="btn btn-primary" onclick="openModal()">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Villa
  </button>
  <div class="filter-group">
    <button class="filter-btn active" id="f-all" onclick="setFilter('all')">All</button>
    <button class="filter-btn" id="f-pending" onclick="setFilter('pending')">Unused</button>
    <button class="filter-btn" id="f-used" onclick="setFilter('used')">Used</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><strong id="s-total">0</strong>Total</div>
  <div class="stat"><strong id="s-used">0</strong>Used</div>
  <div class="stat"><strong id="s-pending">0</strong>Unused</div>
</div>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Villa Name</th>
        <th>Villa Review</th>
        <th>Used</th>
        <th>Remarks</th>
        <th>Date</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div id="empty-state" class="empty-state" style="display:none;">
    <svg width="40" height="40" fill="none" stroke="#c9b99a" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="15" x2="12" y2="15"/></svg>
    <p>No entries yet. Click "Add Villa" to get started.</p>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modal-title">Add Villa</h2>
    <div class="form-field">
      <label>Villa Name</label>
      <input class="form-input" id="inp-name" type="text" placeholder="e.g. Villa Serenity Ubud">
    </div>
    <div class="form-field">
      <label>Villa Review</label>
      <textarea class="form-input" id="inp-review" placeholder="Paste review text here..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'villa-reviews-v1';
  let data = [];
  let filter = 'all';
  let editId = null;

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { try { data = JSON.parse(raw); } catch(e) { data = []; } }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showSaveStatus();
  }

  function showSaveStatus() {
    const el = document.getElementById('save-status');
    el.textContent = 'Saved ✓';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ''; }, 2000);
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function setFilter(f) {
    filter = f;
    ['all','pending','used'].forEach(id => {
      document.getElementById('f-'+id).classList.toggle('active', id === f);
    });
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('table-body');
    const empty = document.getElementById('empty-state');

    let rows = data;
    if (filter === 'used') rows = data.filter(r => r.used);
    if (filter === 'pending') rows = data.filter(r => !r.used);

    const total = data.length;
    const usedCount = data.filter(r => r.used).length;
    document.getElementById('s-total').textContent = total + '\u00a0';
    document.getElementById('s-used').textContent = usedCount + '\u00a0';
    document.getElementById('s-pending').textContent = (total - usedCount) + '\u00a0';

    if (rows.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = rows.map(row => {
      const isLong = row.review && row.review.length > 180;
      const reviewHtml = isLong
        ? `<div class="review-text collapsed" id="rv-${row.id}">${escHtml(row.review)}</div>
           <button class="expand-btn" id="eb-${row.id}" onclick="toggleReview('${row.id}')">Read more</button>`
        : `<div class="review-text">${escHtml(row.review || '—')}</div>`;

      return `<tr class="${row.used ? 'row-used' : ''}" id="tr-${row.id}">
        <td>
          <div class="villa-name">${escHtml(row.name)}</div>
          ${row.used ? '<span class="badge-used">Used</span>' : ''}
        </td>
        <td class="review-cell">${reviewHtml}</td>
        <td class="check-cell">
          <div class="custom-checkbox ${row.used ? 'checked' : ''}" onclick="toggleUsed('${row.id}')">
            <svg width="13" height="13" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </td>
        <td>
          <textarea class="notes-input" rows="2" placeholder="Add remarks..." onchange="updateField('${row.id}','notes',this.value)" onblur="updateField('${row.id}','notes',this.value)">${escHtml(row.notes || '')}</textarea>
        </td>
        <td>
          <input class="date-input" type="date" value="${row.date || ''}" onchange="updateField('${row.id}','date',this.value)">
        </td>
        <td>
          <button class="del-btn" title="Delete" onclick="deleteRow('${row.id}')">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
            </svg>
          </button>
        </td>
      </tr>`;
    }).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toggleReview(id) {
    const el = document.getElementById('rv-'+id);
    const btn = document.getElementById('eb-'+id);
    if (el.classList.contains('collapsed')) {
      el.classList.remove('collapsed');
      btn.textContent = 'Collapse';
    } else {
      el.classList.add('collapsed');
      btn.textContent = 'Read more';
    }
  }

  function toggleUsed(id) {
    const row = data.find(r => r.id === id);
    if (row) {
      row.used = !row.used;
      if (row.used && !row.date) {
        row.date = new Date().toISOString().slice(0,10);
      }
      saveData();
      renderTable();
    }
  }

  function updateField(id, field, value) {
    const row = data.find(r => r.id === id);
    if (row) { row[field] = value; saveData(); }
  }

  function deleteRow(id) {
    if (!confirm('Delete this villa entry?')) return;
    data = data.filter(r => r.id !== id);
    saveData();
    renderTable();
  }

  function openModal(id) {
    editId = id || null;
    if (editId) {
      const row = data.find(r => r.id === editId);
      document.getElementById('modal-title').textContent = 'Edit Villa';
      document.getElementById('inp-name').value = row.name;
      document.getElementById('inp-review').value = row.review;
    } else {
      document.getElementById('modal-title').textContent = 'Add Villa';
      document.getElementById('inp-name').value = '';
      document.getElementById('inp-review').value = '';
    }
    document.getElementById('overlay').classList.add('open');
    setTimeout(() => document.getElementById('inp-name').focus(), 100);
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    editId = null;
  }

  function saveEntry() {
    const name = document.getElementById('inp-name').value.trim();
    const review = document.getElementById('inp-review').value.trim();
    if (!name) { alert('Please enter a villa name.'); return; }
    if (editId) {
      const row = data.find(r => r.id === editId);
      row.name = name;
      row.review = review;
    } else {
      data.unshift({ id: uid(), name, review, used: false, notes: '', date: '' });
    }
    saveData();
    renderTable();
    closeModal();
  }

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  loadData();
  renderTable();
</script>
</body>
</html>
